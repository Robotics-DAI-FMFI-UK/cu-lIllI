defaults:
    - override hydra/launcher: submitit_local

# environment
task: lilli-walk  # Change this to your robot's task
obs: state

# evaluation
checkpoint: ../../../checkpoints/model.pth
eval_episodes: 10
eval_freq: 50000

# training
steps: 2_000_000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
exp_name: lilli_training  # Set a name for your experiment
data_dir: data/

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3  # This says how many consecutive steps should be taken into account
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
model_size: 5  # Set model size. Must be one of [1, 5, 19, 48, 317]
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8

# logging
wandb_project: lilli-walking  # Set a project name
wandb_entity: null  # Set to null if not using Weights & Biases
wandb_silent: false
enable_wandb: true  # Disable if not using Weights & Biases
save_csv: true

# misc
save_video: false
save_agent: true
seed: 500     # in which numbered folder will the output be

# convenience
work_dir: work_dir/  # Set a path for logs
task_title: lilli-walk
multitask: true  # Change to false for single-task training
tasks: ["lilli-walk"]  # Define the task
obs_shape: {state: [9]}  # robot's observation space
action_dim: 9  # number of control joints
episode_length: 10  # how long each training episode should be
obs_shapes: {state: [9]}
action_dims: [9]
episode_lengths: [10]
seed_steps: 1000
bin_size: 0.1

# speedups
compile: True

# robot
joints_lowest: -10  # lowest degree for every joint
joints_highest: 10  # highest degree for every joint
port_num: 19998 # first port (listening on port 19997 by default)
model: /home/lukas/Desktop/CoppeliaSim/modelBasic.ttm #your path to model
max_distance: 1 #in meters
coppelia_dir: /home/kostrian/CoppeliaSim_Edu_V4_4_0_rev0_Ubuntu20_04 #your path to CoppeliaSim
scene_file: NoVoid #TrolleyVoid.ttt
num_coppelia: 8    #number of parallel instances
manual_evaluation: false    #set to true when manually opening CoppeliaSim to see the resulting model
